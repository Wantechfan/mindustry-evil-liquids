#Mod Name and Desc
mod.evil-liquids.name = Evil Liquids
mod.evil-liquids.description = This mod adds neoplasm version of all liquids (except Water which already has it's own neoplasm).
mod.evil-liquids.subtitle = It drinks.

#Suspulo
liquid.evil-liquids-evil-cryofluid.name = Evil Cryofluid
liquid.evil-liquids-evil-cryofluid.description = Forbidden Mud. \n\nDrains Cryofluid while damaging the block that contains it until the block destroyed or the Cryofluid drained.
liquid.evil-liquids-evil-oil.name = Evil Oil
liquid.evil-liquids-evil-oil.description = Oh my got bro it's so sus don't think about it. \n\nDrains Oil while damaging the block that contains it until the block destroyed or the Oil drained.

#Both Plenets
liquid.evil-liquids-evil-slag.name = Evil Slag
liquid.evil-liquids-evil-slag.description = When you put some sort of poison into the Water. \n\nDrains Slag while damaging the block that contains it until the block destroyed or the Slag drained.

#Erekor
liquid.evil-liquids-evil-arkycite.name = Evil Arkycite
liquid.evil-liquids-evil-arkycite.description = Damn it looks like alien liquids for real. \n\nDrains Arkycite while damaging the block that contains it until the block destroyed or the Arkycite drained.
liquid.evil-liquids-evil-cyanogen.name = Evil Cyanogen
liquid.evil-liquids-evil-cyanogen.description = Fits that one Erekir biome. \n\nDrains Cyanogen while damaging the block that contains it until the block destroyed or the Cyanogen drained.
liquid.evil-liquids-evil-hydrogen.name = Evil Hydrogen
liquid.evil-liquids-evil-hydrogen.description = Erekirean diarrhea. \n\nDrains Hydrogen while damaging the block that contains it until the block destroyed or the Hydrogen drained.
liquid.evil-liquids-evil-neoplasm.name = Evil Neoplasm
liquid.evil-liquids-evil-neoplasm.description = The only cure for Neoplasmed pipes. \n\nDrains Neoplasm while damaging the block that contains it until the block destroyed or the Neoplasm drained.
liquid.evil-liquids-evil-nitrogen.name = Evil Nitrogen
liquid.evil-liquids-evil-nitrogen.description = Looks like real poison. \n\nDrains Nitrogen while damaging the block that contains it until the block destroyed or the Nitrogen drained.
liquid.evil-liquids-evil-ozone.name = Evil Ozone
liquid.evil-liquids-evil-ozone.description = Green tea in steroids. \n\nDrains Ozone while damaging the block that contains it until the block destroyed or the Ozone drained.
