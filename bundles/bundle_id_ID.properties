#Mod Name and Desc
mod.evil-liquids.name = Cairan Jahat
mod.evil-liquids.auther = WantechFan
mod.evil-liquids.description = Mod ini menambahkan versi neoplasma dari semua cairan (kecuali Air yang sudah punya neoplasmanya sendiri).
mod.evil-liquids.subtitle = Itu meminumnya.

#Both Plenets
liquid.evil-liquids-01-evil-slag.name = Lava Jahat
liquid.evil-liquids-01-evil-slag.description = Ketika kamu memasukkan semacam racun ke Air. \n\nMenghabiskan Lava sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Lavanya habis.

#Suspulo
liquid.evil-liquids-02-evil-oil.name = Minyak Jahat
liquid.evil-liquids-02-evil-oil.description = Ya ampun terlihat sangat mencurigakan jangan pikirkan itu. \n\nMenghabiskan Minyak sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Minyaknya habis.
liquid.evil-liquids-03-evil-cryofluid.name = Kriogenik Jahat
liquid.evil-liquids-03-evil-cryofluid.description = Lumpur Terlarang. \n\nMenghabiskan Kriogenik sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Kriogeniknya habis.

#Erekor
liquid.evil-liquids-04-evil-neoplasm.name = Neoplasma Jahat
liquid.evil-liquids-04-evil-neoplasm.description = Satu satunya obat penyembuh Neoplasma. \n\nMenghabiskan Neoplasma sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Neoplasmanya habis.
liquid.evil-liquids-05-evil-arkycite.name = Arkisit Jahat
liquid.evil-liquids-05-evil-arkycite.description = Ya ampun itu terlihat seperti cairan alien. \n\nMenghabiskan Arkisit sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Arkisitnya habis.
liquid.evil-liquids-06-evil-ozone.name = Ozon Jahat
liquid.evil-liquids-06-evil-ozone.description = Teh ijo di dimensi yang lain. \n\nMenghabiskan Ozon sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Ozonnya habis.
liquid.evil-liquids-07-evil-hydrogen.name = Hidrogen Jahat
liquid.evil-liquids-07-evil-hydrogen.description = Mencret versi Erekir. \n\nMenghabiskan Hidrogen sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Hidrogennya habis.
liquid.evil-liquids-08-evil-nitrogen.name = Nitrogen Jahat
liquid.evil-liquids-08-evil-nitrogen.description = Terlihat seperti racun beneran. \n\nMenghabiskan Nitrogen sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Nitrogennya habis.
liquid.evil-liquids-09-evil-cyanogen.name = Sianogen Jahat
liquid.evil-liquids-09-evil-cyanogen.description = Mirip dengan bioma Erekir yang satu itu. \n\nMenghabiskan Sianogen sambil menyakiti blok yang mengandungnya sampai bloknya hancur atau Sianogennya habis.
